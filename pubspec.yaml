name: my_personal_lib_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  get_it: ^9.3.0
  dio: ^5.11.1
  mobx: ^2.7.0
  sizer: ^3.1.3
  flutter_mobx: ^2.4.0
  go_router: ^18.1.4
  shared_preferences: ^2.5.6
  toastification: ^3.2.2
  json_annotation: ^4.12.0
  flutter_dotenv: ^6.0.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_svg: ^2.5.0
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  build_runner: ^2.16.1
  json_serializable: ^6.15.2
  mobx_codegen: ^2.8.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
  - .env

  fonts:
    # Títulos (serifada)
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
    # Corpo e rótulos (sem serifa)
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
